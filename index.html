<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Putt Realms</title>
  </head>
  <body>
    <div id="app">
      <div
        id="title-screen"
        class="title-screen"
        role="dialog"
        aria-modal="true"
        aria-labelledby="title-screen-heading"
        tabindex="0"
      >
        <div class="title-screen__inner">
          <h1 id="title-screen-heading" class="title-screen__visually-hidden">
            Putt Realms
          </h1>
          <img
            class="title-screen__logo"
            src="/assets/ui/putt_realms_logo.png"
            alt=""
            width="640"
            height="360"
            decoding="async"
          />
          <p class="title-screen__cta">Tap to play</p>
        </div>
      </div>
      <canvas id="game"></canvas>
      <div id="hud" class="hud" aria-hidden="false">
        <header class="hud-top">
          <div class="hud-top__bar">
            <div class="hud-top__container" aria-hidden="true">
              <img
                class="hud-top__container-img"
                src="/assets/ui/hud_topbar_container.png"
                alt=""
                width="975"
                height="178"
                decoding="async"
              />
            </div>
            <div class="hud-top__row">
            <div
              class="hud-top__level"
              data-slot="level-badge"
              role="group"
              aria-label="Hole number"
            >
              <img
                class="hud-top__level-img"
                src="/assets/ui/hud_topbar_level.png"
                alt=""
                width="120"
                height="120"
                decoding="async"
              />
              <span class="hud-top__level-value" id="hud-level-value">1</span>
              <span class="hud-top__level-meta" id="hud-difficulty">DIFF 0/20</span>
            </div>

            <div class="hud-top__coins" role="group" aria-label="Coins">
              <img
                class="hud-top__coins-img"
                src="/assets/ui/hud_topbar_coins.png"
                alt=""
                width="673"
                height="230"
                decoding="async"
              />
              <span class="hud-top__coins-count" id="hud-coins">0</span>
            </div>

            <div class="hud-top__mid">
              <div class="hud-top__strokes" role="group" aria-label="Strokes">
                <img
                  class="hud-top__strokes-img"
                  src="/assets/ui/hud_topbar_strokes.png"
                  alt=""
                  width="200"
                  height="200"
                  decoding="async"
                />
                <span class="hud-top__strokes-label">Strokes</span>
                <span class="hud-top__strokes-value" id="hud-strokes-value"
                  >0</span
                >
              </div>
              <div class="hud-top__par" role="group" aria-label="Par">
                <img
                  class="hud-top__par-img"
                  src="/assets/ui/hud_topbar_par.png"
                  alt=""
                  width="120"
                  height="140"
                  decoding="async"
                />
                <span class="hud-top__par-label">Par</span>
                <span class="hud-top__par-value" id="hud-par-value">—</span>
              </div>
            </div>

            <div class="hud-top__actions">
              <button
                type="button"
                class="hud-top__action-btn"
                id="hud-settings-btn"
                aria-label="Settings"
              >
                <img
                  src="/assets/ui/hud_topbar_settings.png"
                  alt=""
                  width="72"
                  height="72"
                  decoding="async"
                />
              </button>
              <button
                type="button"
                class="hud-top__action-btn"
                id="hud-pause-btn"
                aria-label="Pause"
              >
                <img
                  src="/assets/ui/hud_topbar_pause.png"
                  alt=""
                  width="72"
                  height="72"
                  decoding="async"
                />
              </button>
            </div>
            </div>
          </div>
        </header>

        <div class="hud-leaderboard-entry">
          <button
            type="button"
            class="hud-leaderboard-btn"
            id="hud-leaderboard-btn"
            aria-label="Open leaderboard"
            aria-expanded="false"
            aria-controls="hud-leaderboard-panel"
          >
            <img
              src="/assets/ui/leaderboard_button.png"
              alt=""
              width="900"
              height="262"
              decoding="async"
            />
          </button>
        </div>

        <div
          id="hud-leaderboard-panel"
          class="hud-leaderboard hud-leaderboard--hidden"
          role="dialog"
          aria-modal="true"
          aria-label="Leaderboard"
        >
          <div class="hud-leaderboard__shade" id="hud-leaderboard-shade"></div>
          <section class="hud-leaderboard__card">
            <button
              type="button"
              class="hud-leaderboard__close"
              id="hud-leaderboard-close"
              aria-label="Close leaderboard"
            >
              X
            </button>
            <p class="hud-leaderboard__level" id="hud-leaderboard-level"></p>
            <ol class="hud-leaderboard__list" id="hud-leaderboard-list"></ol>
          </section>
        </div>

        <div
          id="hud-callout"
          class="hud-callout hud-callout--hidden"
          aria-live="assertive"
        >
          <div class="hud-callout__backdrop"></div>
          <div class="hud-callout__wrap">
            <img
              id="hud-callout-img"
              class="hud-callout__img hud-callout__img--hidden"
              alt=""
              decoding="async"
            />
            <div id="hud-callout-fallback" class="hud-callout__fallback"></div>
          </div>
        </div>

        <div class="hud-mid">
          <div
            id="hud-toast"
            class="hud-toast hud-toast--hidden"
            role="status"
            aria-live="polite"
          ></div>
        </div>

        <div
          class="hud-skip-row hud-skip-row--hidden"
          id="hud-skip-wrap"
        >
          <div class="hud-skip-stack">
            <button
              type="button"
              class="hud-skip-btn"
              id="hud-skip-btn"
              aria-label="Skip level"
            >
              Skip level
            </button>
            <div class="hud-skip-price" role="presentation">
              <div class="hud-skip-chip">
                <img
                  class="hud-skip-coin-icon"
                  src="/assets/ui/coin_collectible.png"
                  alt=""
                  width="64"
                  height="64"
                  decoding="async"
                />
                <span class="hud-skip-cost" id="hud-skip-cost"></span>
              </div>
            </div>
          </div>
        </div>

        <footer class="hud-bottom">
          <div class="hud-instruction-stack" id="hud-instruction-panel">
            <div
              class="hud-instruction-power hud-instruction-power--hidden"
              id="hud-power-wrap"
            >
              <span class="hud-instruction-power-pct" id="hud-power-pct"
                >0%</span
              >
              <div
                class="charge-bar"
                id="hud-power-bar"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div class="charge-bar__track">
                  <img
                    class="charge-bar__track-img"
                    src="/assets/ui/power_charge_bar.png"
                    alt=""
                    width="360"
                    height="80"
                    decoding="async"
                  />
                  <div
                    class="charge-bar__pointer"
                    id="hud-charge-pointer"
                    aria-hidden="true"
                  >
                    <img
                      src="/assets/ui/power_charge_arrow.png"
                      alt=""
                      width="72"
                      height="48"
                      decoding="async"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="hud-instruction-plate">
              <img
                class="hud-instruction-plate__img"
                src="/assets/ui/hud_topbar_container.png"
                alt=""
                width="975"
                height="178"
                decoding="async"
              />
              <p class="hud-instruction-hint" id="hud-hint">Drag to aim</p>
            </div>
          </div>
          <p
            id="hud-seed"
            class="hud-seed hud-seed--hidden"
            aria-label="Procgen seed, endpoint targetDifficulty and levelIndex; hover for full replay JSON"
          ></p>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
