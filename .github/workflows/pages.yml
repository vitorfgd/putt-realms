# Publishes the Vite production build only. In the repo:
# Settings → Pages → Build and deployment → Source MUST be “GitHub Actions”.
# If Source is “Deploy from a branch”, browsers load raw index.html (/src/main.ts, %BASE_URL%, etc.).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm ci && npm run build

      - name: Verify dist is a production bundle (not source index.html)
        run: |
          if grep -qE '/src/main\.ts|%BASE_URL%' dist/index.html; then
            cat dist/index.html
            echo 'dist/index.html still looks like Vite dev/source; check build and base path.'
            exit 1
          fi
          if ! grep -qE 'assets/index-[^"[:space:]]+\.js' dist/index.html; then
            echo 'dist/index.html is missing hashed /assets/index-*.js entry script.'
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
